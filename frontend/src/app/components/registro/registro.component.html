<div class="registro-container">
  <div class="registro-card">
    <h2>📝 Crear Cuenta</h2>
     
    <!-- Mensaje de error dinámico -->
    <div *ngIf="errorMessage" style="background: #f8d7da; color: #721c24; padding: 15px; margin-bottom: 20px; border-radius: 10px; border-left: 4px solid #dc3545;">
      <strong>⚠️ ERROR:</strong> {{ errorMessage }}
    </div>
    
    <form (ngSubmit)="onSubmit()" #registroForm="ngForm">
      <div class="form-group">
        <label for="name">👤 Nombre completo</label>
        <input type="text" id="name" name="name" [(ngModel)]="name" required #nameInput="ngModel" placeholder="Tu nombre">
        <div *ngIf="nameInput.invalid && nameInput.touched" class="error">El nombre es obligatorio</div>
      </div>

      <div class="form-group">
        <label for="email">📧 Email</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" required email #emailInput="ngModel" placeholder="tu@email.com">
        <div *ngIf="emailInput.invalid && emailInput.touched" class="error">Email válido requerido</div>
      </div>

      <div class="form-group">
        <label for="password">🔒 Contraseña</label>
        <input type="password" id="password" name="password" [(ngModel)]="password" required minlength="6" #passwordInput="ngModel" placeholder="******">
        <div *ngIf="passwordInput.invalid && passwordInput.touched" class="error">Contraseña requerida (mínimo 6 caracteres)</div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">🔒 Confirmar Contraseña</label>
        <input type="password" id="confirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword" required #confirmInput="ngModel" placeholder="******">
        <div *ngIf="confirmInput.invalid && confirmInput.touched" class="error">Confirma tu contraseña</div>
        <div *ngIf="password !== confirmPassword && confirmInput.touched" class="error">Las contraseñas no coinciden</div>
      </div>

      <button type="submit" [disabled]="registroForm.invalid || password !== confirmPassword || isLoading" class="btn-registro">
        {{ isLoading ? 'Registrando...' : 'Registrarse' }}
      </button>
    </form>

    <p class="login-link">¿Ya tienes cuenta? <a routerLink="/login">Iniciar sesión</a></p>
  </div>
</div>
