<!-- Usar router-outlet para todas las pantallas cuando no hay sesión -->
<div *ngIf="!isLoggedIn">
  <router-outlet></router-outlet>
</div>

<!-- Pantalla principal cuando está logueado -->
<div *ngIf="isLoggedIn" [class.dark-mode]="isDarkMode">
  <app-header (toggleTheme)="toggleTheme()"></app-header>
  <main>
    <router-outlet></router-outlet>
  </main>
  <app-footer></app-footer>
</div>
