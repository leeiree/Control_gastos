<!-- Mostrar header/footer EN TODAS LAS PANTALLAS excepto login/registro -->
<ng-container *ngIf="!router.url.startsWith('/login') && !router.url.startsWith('/registro')">
  <app-header (toggleTheme)="toggleTheme()"></app-header>
  <main>
    <router-outlet></router-outlet>
  </main>
  <app-footer></app-footer>
</ng-container>

<!-- Para login/registro: solo el contenido sin header/footer -->
<ng-container *ngIf="router.url.startsWith('/login') || router.url.startsWith('/registro')">
  <router-outlet></router-outlet>
</ng-container>
